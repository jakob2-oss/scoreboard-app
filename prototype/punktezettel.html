<title>Punktezettel Prototyp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Konzept „Spieleabend“: handgezeichneter Comic-Stil mit dunklen Konturen und warmen,
   flächigen Farben. Karten und Hauptknöpfe wirken wie Sticker (Kontur + harter Schatten),
   Tasten bleiben leise, damit nichts überladen wirkt. Hell = Papier, Dunkel = Spielenacht. */
:root {
  --bg: #f4efe4;            /* Papier */
  --surface: #fffdf7;
  --fill: rgba(43, 36, 30, .06);
  --fill-2: rgba(43, 36, 30, .12);
  --sep: rgba(43, 36, 30, .12);
  --edge: rgba(43, 36, 30, .16);
  --ink: #2b241e;           /* Konturfarbe */
  --fg: #2b241e;
  --muted: #776d61;
  --faint: #cfc6b5;
  --primary: #d94a2e;       /* Ziegelrot */
  --on-primary: #ffffff;
  --sun: #f2b93b;           /* Senf / Mond */
  --sky: #6aa6dc;
  --good: #3f9a52;
  --danger: #d23f2c;
  --ill-bg: #ddd6c6;
  --scrim: rgba(43, 36, 30, .35);
  --f-body: "Nunito", -apple-system, system-ui, sans-serif;
  --f-display: "Fredoka", "Nunito", -apple-system, system-ui, sans-serif;
  --f-num: "Fredoka", "Nunito", -apple-system, system-ui, sans-serif;
  --r: 16px;
  --r-lg: 24px;
  --stick: 0 3px 0 var(--ink);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181b29; --surface: #232839; --fill: rgba(255, 255, 255, .06); --fill-2: rgba(255, 255, 255, .12);
    --sep: rgba(255, 255, 255, .09); --edge: rgba(0, 0, 0, .45); --ink: #0c0e16; --fg: #f5efe3; --muted: #a4a8ba; --faint: #464c63;
    --primary: #e2583b; --on-primary: #ffffff; --good: #5cc07a; --danger: #ff7a66; --ill-bg: #2c3248; --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #181b29; --surface: #232839; --fill: rgba(255, 255, 255, .06); --fill-2: rgba(255, 255, 255, .12);
  --sep: rgba(255, 255, 255, .09); --edge: rgba(0, 0, 0, .45); --ink: #0c0e16; --fg: #f5efe3; --muted: #a4a8ba; --faint: #464c63;
  --primary: #e2583b; --on-primary: #ffffff; --good: #5cc07a; --danger: #ff7a66; --ill-bg: #2c3248; --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 16px; line-height: 1.35; font-weight: 600;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
button:disabled { cursor: default; }
.screen { height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; font-weight: 600; }
.eyebrow { font-family: var(--f-display); font-size: 15px; color: var(--muted); font-weight: 500; padding-left: 4px; }

/* ---------- Topbar ---------- */
.top { display: flex; align-items: center; gap: 4px; padding-block: 6px; min-height: 56px; }
.top .grow { flex: 1; min-width: 0; }
.top h2 { font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-left: -8px; }
.top .icon-btn:last-child { margin-left: 0; margin-right: -8px; }
.icon-btn:active { background: var(--fill-2); }
.icon-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Karten & Listen (Sticker) ---------- */
.list { background: var(--surface); border-radius: var(--r); border: 2px solid var(--ink); box-shadow: var(--stick); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; min-height: 58px; padding: 10px 16px; position: relative; }
.row + .row { border-top: 2px dashed var(--sep); }
.row:active { background: var(--fill); }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-family: var(--f-display); font-weight: 600; font-size: 17px; }
.row .t small { display: block; color: var(--muted); font-size: 13px; font-weight: 600; }
.chev { width: 9px; height: 14px; flex: none; stroke: var(--muted); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Start ---------- */
.brand { padding-block: 14px 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; }
.brand .hero-ill { width: 220px; max-width: 70%; height: auto; display: block; }
.brand h1 { font-size: 36px; font-weight: 700; line-height: 1.05; margin-top: 4px; }
.brand p { margin: 0; color: var(--muted); font-size: 15px; }
.home-body { display: flex; flex-direction: column; gap: 22px; padding-block: 18px 32px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.resume { display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; background: var(--sun); color: #2b241e; border-radius: var(--r); padding: 14px 16px; border: 2px solid var(--ink); box-shadow: var(--stick); }
.resume:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.resume .t { flex: 1; min-width: 0; }
.resume small { display: block; font-size: 13px; opacity: .75; }
.resume b { display: block; font-family: var(--f-display); font-size: 19px; font-weight: 600; }
.resume .go-pill { flex: none; background: var(--surface); color: var(--fg); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 14px; font-family: var(--f-display); font-weight: 600; }
.tpl .del { color: var(--danger); font-size: 14px; padding: 8px; margin: -8px; }
.note { font-size: 13px; color: var(--muted); margin: 0; text-align: center; }

/* ---------- Spieler wählen ---------- */
.players-body { display: flex; flex-direction: column; gap: 22px; padding-block: 8px 24px; }
.order { display: flex; flex-direction: column; }
.order .row { min-height: 52px; }
.order-row .pos { font-family: var(--f-num); color: var(--muted); width: 16px; }
.order-row .nm { flex: 1; font-family: var(--f-display); font-weight: 500; font-size: 17px; }
.order-row .rm { color: var(--muted); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; margin-right: -6px; }
.empty-order { color: var(--muted); font-size: 15px; padding: 16px; }
.dot { width: 13px; height: 13px; border-radius: 50%; flex: none; background: var(--c, var(--muted)); border: 2px solid var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 0 16px; border-radius: 999px; background: var(--surface); border: 2px solid var(--edge); min-height: 42px; font-family: var(--f-display); font-weight: 500; font-size: 16px; }
.chip[aria-pressed="true"] { background: var(--sky); color: #1b2533; border-color: var(--ink); box-shadow: 0 2px 0 var(--ink); }
.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1; min-width: 0; height: 48px; border-radius: 14px; border: 2px solid var(--edge); background: var(--surface); color: var(--fg); padding: 0 14px; font: inherit; font-size: 16px; }
.add-row input::placeholder { color: var(--muted); }
.add-row button { height: 48px; padding: 0 16px; border-radius: 14px; background: var(--surface); border: 2px solid var(--edge); font-family: var(--f-display); font-weight: 600; }

/* ---------- Knöpfe ---------- */
.dock { padding-block: 10px 12px; background: var(--bg); display: flex; gap: 10px; }
.primary {
  flex: 1; min-height: 54px; border-radius: var(--r); background: var(--primary); color: var(--on-primary);
  font-family: var(--f-display); font-weight: 600; font-size: 19px; padding: 0 16px;
  border: 2px solid var(--ink); box-shadow: var(--stick);
}
.primary:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.primary:disabled { opacity: .4; }
.secondary { min-height: 54px; min-width: 54px; border-radius: var(--r); background: var(--surface); border: 2px solid var(--ink); box-shadow: var(--stick); font-family: var(--f-display); font-weight: 600; padding: 0 16px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.secondary:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.secondary:disabled { opacity: .4; box-shadow: none; }
.secondary svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-reduced-motion: reduce) { .primary:active, .secondary:active, .resume:active { transform: none; } }

/* ---------- Zettel (Überblick) ---------- */
.sheet-wrap { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; position: relative; }
body.pad-open #g-dock, body.pad-open #banner { display: none !important; }
table.grid { border-collapse: separate; border-spacing: 0; min-width: 100%; user-select: none; -webkit-user-select: none; }
.grid th, .grid td { border-bottom: 2px dashed var(--sep); }
.grid thead th { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 8px 4px 10px; min-width: 72px; cursor: pointer; border-bottom: 2px solid var(--ink); }
.grid thead th .pn { display: flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--f-display); font-weight: 600; font-size: 15px; }
.grid thead th .pn span { max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grid thead th .bar { width: 12px; height: 12px; border-radius: 50%; background: var(--c); border: 2px solid var(--ink); flex: none; order: -1; }
.grid .corner, .grid .rn, .grid .cat, .grid tfoot th { position: sticky; left: 0; z-index: 2; background: var(--bg); }
.grid thead .corner { z-index: 4; min-width: 40px; color: var(--muted); cursor: default; font-family: var(--f-display); }
.grid .rn { width: 40px; min-width: 40px; text-align: center; color: var(--muted); font-family: var(--f-num); font-size: 15px; font-weight: 500; }
.grid .cat { text-align: left; font-family: var(--f-display); font-weight: 500; font-size: 16px; padding: 0 8px 0 max(16px, env(safe-area-inset-left, 0px)); min-width: 128px; white-space: nowrap; }
.grid .cat small { display: block; color: var(--muted); font-family: var(--f-body); font-size: 12px; }
.grid td.cell { height: 52px; text-align: center; font-family: var(--f-num); font-size: 22px; font-weight: 500; cursor: pointer; position: relative; }
.grid td.cell:active { background: var(--fill); }
.grid td.cell.empty::after { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); vertical-align: middle; }
.grid td.cell.neg { color: var(--danger); }
.grid td.cell.zero { color: var(--muted); }
.grid td.cell.active { background: var(--surface); box-shadow: inset 0 0 0 3px var(--sky); border-radius: 12px; }
.grid td.cell small { display: block; font-family: var(--f-body); font-size: 11px; color: var(--muted); font-weight: 700; line-height: 1.1; }
.grid td.cell.pend::after { content: none; }
.grid tr.cur th, .grid tr.cur td { background: var(--fill); }
.grid tr.cur th.rn { color: var(--fg); }
.grid tr.calc th, .grid tr.calc td { height: 38px; font-size: 13px; color: var(--muted); }
.grid tr.calc td { text-align: center; font-family: var(--f-num); font-size: 14px; }
.grid tr.calc td.hit { color: var(--good); font-weight: 600; }
.grid tr.sep th, .grid tr.sep td { border-top: 2px solid var(--ink); }
.grid tfoot th, .grid tfoot td { position: sticky; bottom: 0; z-index: 2; background: var(--surface); border-bottom: 0; border-top: 2px solid var(--ink); }
.grid tfoot th { z-index: 3; font-family: var(--f-display); font-size: 20px; text-align: center; }
.grid tfoot td { text-align: center; padding: 8px 4px 10px; }
.grid tfoot .tot { font-family: var(--f-num); font-size: 26px; font-weight: 600; display: block; line-height: 1.1; }
.grid tfoot .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: center; align-items: center; gap: 3px; margin-top: 2px; }
.grid tfoot td.lead .meta { color: var(--fg); font-weight: 800; }
.crown { width: 16px; height: 13px; flex: none; }
.ov-hint { color: var(--muted); font-size: 13px; text-align: center; margin: 0; padding-block: 20px; }

.banner { display: flex; align-items: center; gap: 12px; padding-block: 10px; background: var(--sun); color: #2b241e; border-top: 2px solid var(--ink); font-size: 14px; }
.banner .grow { flex: 1; min-width: 0; }
.banner b { font-family: var(--f-display); font-weight: 600; font-size: 16px; }
.banner span { color: inherit !important; opacity: .75; }
.banner button { background: var(--surface); color: var(--fg); border: 2px solid var(--ink); box-shadow: 0 2px 0 var(--ink); border-radius: 999px; padding: 7px 14px; font-family: var(--f-display); font-weight: 600; flex: none; }

/* ---------- Seitenleiste ---------- */
.pp-page.ov { padding: 0; overflow: hidden; }
.pp-page > .ov-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
.sheet-wrap.pp-mode { overflow: hidden; display: flex; flex-direction: column; }
.pp-tabs { display: flex; justify-content: center; align-items: center; padding-block: 0 4px; flex: none; overflow-x: auto; scrollbar-width: none; }
.pp-tabs::-webkit-scrollbar, .pp-swipe::-webkit-scrollbar { display: none; }
.pp-tab { flex: none; display: grid; place-items: center; width: 26px; height: 28px; color: var(--faint); }
.pp-tab .ov-ic { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.4; }
.pp-tab .dot { width: 10px; height: 10px; background: var(--faint); border: 0; border-radius: 6px; transition: width .2s, background .2s; }
.pp-tab[aria-current="true"] { color: var(--fg); }
.pp-tab[aria-current="true"] .dot { width: 22px; background: var(--c); border: 2px solid var(--ink); height: 12px; }
@media (prefers-reduced-motion: reduce) { .pp-tab .dot { transition: none; } }

/* ---------- Spielerseiten ---------- */
.pp-swipe { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.pp-page { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-block: 6px 16px; }
.pp-page > * { flex: none; }
.pp-hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-inline: 2px; }
.pp-hero > div { min-width: 0; }
.pp-hero h3 { font-size: 30px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 10px; }
.pp-hero h3::before { content: ""; width: 16px; height: 16px; border-radius: 50%; background: var(--c); border: 2.5px solid var(--ink); flex: none; }
.pp-hero .place { color: var(--muted); font-size: 14px; margin-top: 2px; display: flex; align-items: center; gap: 4px; }
.pp-hero .total { font-family: var(--f-num); font-size: 56px; font-weight: 600; line-height: .95; flex: none; }
.pp-entry {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface);
  border-radius: var(--r-lg); padding: 14px 16px; border: 2.5px solid var(--ink); box-shadow: 0 4px 0 var(--c);
}
.pp-entry .lbl { font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.pp-entry small { color: var(--muted); font-size: 13px; }
.pp-entry .val { font-family: var(--f-num); font-size: 44px; font-weight: 600; line-height: 1; }
.pp-entry .val.ph { color: var(--faint); }
.pp-entry .val.neg { color: var(--danger); }
.pp-hist { display: flex; flex-wrap: wrap; gap: 6px; }
.pp-hist button { min-width: 56px; padding: 5px 10px; border-radius: 12px; background: var(--surface); border: 2px solid var(--edge); display: flex; flex-direction: column; align-items: center; }
.pp-hist button small { font-size: 11px; color: var(--muted); font-weight: 700; }
.pp-hist button b { font-family: var(--f-num); font-size: 18px; font-weight: 500; }
.pp-hist button[aria-current="true"] { border-color: var(--ink); box-shadow: 0 2px 0 var(--c); }
.pp-cats { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r); border: 2px solid var(--ink); overflow: hidden; flex: none; }
.pp-cat { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; text-align: left; width: 100%; font-family: var(--f-display); font-weight: 500; font-size: 16px; }
.pp-cat + .pp-cat { border-top: 2px dashed var(--sep); }
.pp-cat small { color: var(--muted); font-family: var(--f-body); font-size: 12px; }
.pp-cat .v { font-family: var(--f-num); font-size: 20px; }
.pp-cat[aria-current="true"] { background: var(--fill); box-shadow: inset 4px 0 0 var(--c); }
.pp-cat.calc { color: var(--muted); font-size: 14px; min-height: 36px; background: var(--fill); }
.pp-cat.calc.hit { color: var(--good); }

/* Wizard */
.pp-entry.wz { flex-direction: column; align-items: stretch; gap: 12px; }
.wz-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.wz-sc { font-family: var(--f-num); font-size: 26px; font-weight: 600; color: var(--good); }
.wz-sc.neg { color: var(--danger); }
.wz-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wz-f { background: var(--fill); border: 2px solid transparent; border-radius: var(--r); padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; min-height: 62px; }
.wz-f small { color: var(--muted); font-family: var(--f-display); font-size: 15px; font-weight: 500; }
.wz-f b { font-family: var(--f-num); font-size: 36px; font-weight: 600; }
.wz-f b.ph { color: var(--faint); }
.wz-f[aria-pressed="true"] { background: var(--surface); border-color: var(--ink); box-shadow: 0 3px 0 var(--c); }
.wz-hint { font-size: 13px; color: var(--muted); }
.wz-hint .warn { color: var(--danger); font-weight: 800; }

/* ---------- Ziffernblock ---------- */
.pp-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.quick::-webkit-scrollbar { display: none; }
.quick button { flex: 1 0 auto; min-width: 44px; min-height: 40px; padding: 0 12px; border-radius: 999px; background: var(--surface); border: 2px solid var(--edge); font-family: var(--f-num); font-weight: 600; font-size: 17px; }
.quick button:active:not(:disabled) { background: var(--sun); border-color: var(--ink); color: #2b241e; }
.quick button.strike { color: var(--muted); font-family: var(--f-display); font-weight: 500; font-size: 15px; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.key { min-height: 50px; border-radius: 14px; background: var(--surface); border: 2px solid var(--edge); box-shadow: 0 2px 0 var(--edge); font-family: var(--f-num); font-size: 26px; font-weight: 500; display: grid; place-items: center; }
.key:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
.key.q { font-size: 18px; }
.key.fn { font-size: 20px; color: var(--muted); background: var(--fill); box-shadow: none; }
.key svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.pp-keys .go {
  grid-column: 4; grid-row: 3 / span 2; background: var(--primary); color: var(--on-primary); border: 2px solid var(--ink); box-shadow: var(--stick);
  font-family: var(--f-display); font-size: 19px; font-weight: 600; line-height: 1.15; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
}
.pp-keys .go:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.go-to { display: flex; align-items: center; gap: 5px; font-family: var(--f-body); font-size: 12px; font-weight: 700; max-width: 100%; opacity: .95; }
.go-to i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); border: 1.5px solid var(--ink); flex: none; }
.go-to span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pp-keys .key:disabled, .quick button:disabled { opacity: .35; }
.pad-actions { display: flex; gap: 10px; }
@media (prefers-reduced-motion: reduce) { .key:active, .pp-keys .go:active { transform: none; } }

/* ---------- Bottom Sheets ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.bsheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg); border-radius: var(--r-lg) var(--r-lg) 0 0;
  border-top: 2.5px solid var(--ink); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-height: 88%; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const now = () => new Date().toISOString();
const COLORS = ['#e0543a', '#5d9fdc', '#4fae5e', '#f2b93b', '#a483d4', '#f08a3c', '#2fb3a6', '#ea7aa7'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (n < 0 ? '−' + Math.abs(n) : String(n));
const store = {
  get(k, d) { try { const v = localStorage.getItem('pz:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pz:' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('pz:' + k); } catch (e) {} }
};
const ICON = {
  undo: '<svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>',
  grid: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>',
  tally: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-5 6M12 9l5 6"/></svg>',
  prev: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>',
  crown: '<svg class="crown" viewBox="0 0 16 13" aria-hidden="true"><path d="M1.6 11.6 1 3.2l4.1 3.4L8 1.4l2.9 5.2L15 3.2l-.6 8.4z" fill="#f2b93b" stroke="#2b241e" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  close: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------------- Vorlagen ---------------- */
const BUILTIN = [
  { id: 'free', glyph: '∞', name: 'Freie Runden', kind: 'rounds', win: 'high', end: { type: 'none' } },
  { id: 'wizard', glyph: 'W', name: 'Wizard', kind: 'bids', win: 'high', end: { type: 'rounds', value: 0 }, view: 'players', min: 3, max: 6 },
  { id: 't500', glyph: '500', name: 'Bis 500 Punkte', kind: 'rounds', win: 'high', end: { type: 'target', value: 500 } },
  { id: 'r10', glyph: '10×', name: '10 Runden', kind: 'rounds', win: 'high', end: { type: 'rounds', value: 10 } },
  { id: 'low9', glyph: '↓9', name: 'Wenig gewinnt', kind: 'rounds', win: 'low', end: { type: 'rounds', value: 9 } },
  { id: 'dice', glyph: '⚄', name: 'Würfel-Kategorien', kind: 'cats', win: 'high', end: { type: 'cats' } },
  { id: 'count', glyph: '±', name: 'Schnellzähler', kind: 'rounds', win: 'high', end: { type: 'none' }, view: 'players' }
];
const DICE = [
  { id: 'c1', name: 'Einser', sec: 'up', quick: [0, 1, 2, 3, 4, 5] },
  { id: 'c2', name: 'Zweier', sec: 'up', quick: [0, 2, 4, 6, 8, 10] },
  { id: 'c3', name: 'Dreier', sec: 'up', quick: [0, 3, 6, 9, 12, 15] },
  { id: 'c4', name: 'Vierer', sec: 'up', quick: [0, 4, 8, 12, 16, 20] },
  { id: 'c5', name: 'Fünfer', sec: 'up', quick: [0, 5, 10, 15, 20, 25] },
  { id: 'c6', name: 'Sechser', sec: 'up', quick: [0, 6, 12, 18, 24, 30] },
  { id: 'k3', name: 'Dreierpasch', sec: 'low', hint: 'Augensumme' },
  { id: 'k4', name: 'Viererpasch', sec: 'low', hint: 'Augensumme' },
  { id: 'fh', name: 'Full House', sec: 'low', fixed: 25 },
  { id: 'ks', name: 'Kleine Straße', sec: 'low', fixed: 30 },
  { id: 'gs', name: 'Große Straße', sec: 'low', fixed: 40 },
  { id: 'f5', name: 'Fünf Gleiche', sec: 'low', fixed: 50 },
  { id: 'ch', name: 'Chance', sec: 'low', hint: 'Augensumme' }
];
const BONUS_AT = 63, BONUS = 35;

function describe(t) {
  if (t.kind === 'cats') return '13 Felder · Bonus ab 63';
  if (t.kind === 'bids') return 'Ansage & Stiche · 3–6 Spieler';
  if (t.view === 'players') return 'Eine Seite pro Spieler · +/− Tasten';
  const w = t.win === 'high' ? 'Höchste Summe gewinnt' : 'Niedrigste Summe gewinnt';
  const e = t.end.type === 'target' ? `Ziel ${t.end.value} Punkte` : t.end.type === 'rounds' ? `${t.end.value} Runden` : 'offen';
  return `${w} · ${e}`;
}
const templates = () => BUILTIN.concat(store.get('tpls', []));

/* ---------------- Zustand ---------------- */
const S = {
  tpl: null,
  sel: [],                                 // gewählte Spielernamen in Reihenfolge
  known: store.get('known', ['Anna', 'Ben', 'Clara', 'David']),
  game: store.get('game', null),
  undo: [],
  pad: null,                               // { pid, ref, buf, fresh }
};
S.pp = { idx: 0, ref: null, buf: '', fresh: true, dirty: false };
const NEW = '__new';

function save() { if (S.game) { S.game.updatedAt = now(); store.set('game', S.game); } }
function snapshot() { S.undo.push(JSON.stringify(S.game)); if (S.undo.length > 100) S.undo.shift(); }

/* ---------------- Berechnung ---------------- */
function catVal(g, cid, pid) { const v = g.cells[cid] && g.cells[cid][pid]; return typeof v === 'number' ? v : null; }
function upper(g, pid) { return DICE.filter(c => c.sec === 'up').reduce((a, c) => a + (catVal(g, c.id, pid) || 0), 0); }
function totals(g) {
  const t = {};
  g.players.forEach(p => {
    if (g.kind === 'cats') {
      const up = upper(g, p.id);
      t[p.id] = up + (up >= BONUS_AT ? BONUS : 0) + DICE.filter(c => c.sec === 'low').reduce((a, c) => a + (catVal(g, c.id, p.id) || 0), 0);
    } else {
      t[p.id] = g.rounds.reduce((a, r) => a + (typeof r.s[p.id] === 'number' ? r.s[p.id] : 0), 0);
    }
  });
  return t;
}
function ranking(g) {
  const t = totals(g);
  const arr = g.players.map(p => ({ p, t: t[p.id] })).sort((a, b) => g.win === 'high' ? b.t - a.t : a.t - b.t);
  let place = 0, last = null;
  arr.forEach((x, i) => { if (x.t !== last) { place = i + 1; last = x.t; } x.place = place; });
  return arr;
}
function anyScore(g) {
  return g.kind === 'cats' ? Object.values(g.cells).some(o => Object.keys(o).length) : g.rounds.some(r => Object.keys(r.s).length);
}
function roundFull(g, r) { return g.players.every(p => typeof r.s[p.id] === 'number'); }
function curRoundIdx(g) {
  const i = g.rounds.findIndex(r => !roundFull(g, r));
  return i === -1 ? g.rounds.length - 1 : i;
}
function endState(g) {
  if (g.kind === 'cats') {
    const done = DICE.every(c => g.players.every(p => catVal(g, c.id, p.id) !== null));
    return done ? { done: true, text: 'Alle Felder ausgefüllt' } : null;
  }
  if (g.end.type === 'rounds') {
    const done = g.rounds.length >= g.end.value && g.rounds.slice(0, g.end.value).every(r => roundFull(g, r));
    return done ? { done: true, text: `${g.end.value} Runden gespielt` } : null;
  }
  if (g.end.type === 'target') {
    const t = totals(g);
    const hit = g.players.filter(p => t[p.id] >= g.end.value);
    if (!hit.length) return null;
    const r = g.rounds[g.rounds.length - 1];
    const full = r && roundFull(g, r);
    return { done: full, text: `${hit.map(p => p.name).join(', ')} über ${g.end.value}` + (full ? '' : ' · Runde zu Ende spielen') };
  }
  return null;
}

/* ---------------- Navigation ---------------- */
function show(id) { ['s-home', 's-players', 's-game'].forEach(s => { $('#' + s).hidden = s !== id; }); }

function renderHome() {
  show('s-home');
  const g = S.game;
  $('#resume-slot').innerHTML = g ? `
    <div class="group"><div class="eyebrow">Laufende Partie</div>
    <button class="resume" data-act="resume">
      <span class="t"><b>${esc(g.name)}</b>
      <small>${g.players.map(p => esc(p.name)).join(', ')}${g.kind !== 'cats' ? ' · Runde ' + (curRoundIdx(g) + 1) : ''}</small></span>
      <span class="go-pill">Weiter</span>
    </button></div>` : '';
  $('#tpl-list').innerHTML = templates().map(t => `
    <button class="row tpl" data-act="pick-tpl" data-id="${t.id}">
      <span class="t"><b>${esc(t.name)}</b><small>${esc(describe(t))}</small></span>
      ${t.custom ? `<span class="del" data-act="del-tpl" data-id="${t.id}" aria-label="Vorlage löschen">Löschen</span>` : '<svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5l5 5-5 5"/></svg>'}
    </button>`).join('');
}

function renderPlayers() {
  show('s-players');
  $('#pl-sub').textContent = S.tpl.name;
  $('#order').innerHTML = S.sel.length ? S.sel.map((n, i) => `
    <div class="row order-row"><span class="pos">${i + 1}</span><span class="dot" style="--c:${COLORS[i % COLORS.length]}"></span>
    <span class="nm">${esc(n)}</span><button class="rm" data-act="toggle-p" data-name="${esc(n)}" aria-label="${esc(n)} entfernen">✕</button></div>`).join('')
    : '<div class="empty-order">Tippe unten auf Namen, um Spieler hinzuzufügen.</div>';
  $('#chips').innerHTML = S.known.map(n => `<button class="chip" data-act="toggle-p" data-name="${esc(n)}" aria-pressed="${S.sel.includes(n)}">${esc(n)}</button>`).join('');
  const b = $('#start-btn');
  const min = S.tpl.min || 1, max = S.tpl.max || 99, n = S.sel.length;
  b.disabled = n < min || n > max;
  b.textContent = n < min ? (min > 1 ? `${S.tpl.name}: mindestens ${min} Spieler` : 'Mindestens 1 Spieler') : n > max ? `${S.tpl.name}: höchstens ${max} Spieler` : `Los · ${n} Spieler`;
}

function newGame(t, names) {
  const g = {

  $('#ov-grid').innerHTML = `<table class="grid">${head}<tbody>${body}</tbody>${foot}</table>
    <p class="ov-hint gutter">Nach links wischen: eigene Seite für jeden Spieler →</p>`;
}

function renderBanner() {
  const b = $('#banner'), e = endState(S.game);
  b.hidden = !e;
  if (e) b.innerHTML = `<div class="grow"><b>${e.done ? 'Spielende erreicht' : 'Fast geschafft'}</b><br><span style="color:var(--muted)">${esc(e.text)}</span></div>
    ${e.done ? '<button data-act="result">Ergebnis</button>' : ''}`;
}

function renderDock() {
  const g = S.game;
  const canAdd = g.kind === 'rounds' && !(g.end.type === 'rounds' && g.rounds.length >= g.end.value);
  const main = isBids(g) ? ((endState(g) || {}).done ? '<button class="primary" data-act="result">Ergebnis</button>' : `<button class="primary" data-act="wz-go">Runde ${curRoundIdx(g) + 1} eintragen →</button>`)
    : g.kind === 'rounds'
    ? (canAdd ? '<button class="primary" data-act="add-round">+ Runde</button>' : '<button class="primary" data-act="result">Ergebnis</button>')
    : '<button class="primary" data-act="result">Ergebnis</button>';
  $('#g-dock').innerHTML = `<button class="secondary" data-act="undo" ${S.undo.length ? '' : 'disabled'} aria-label="Rückgängig">${ICON.undo}</button>${main}`;
}

/* ---------------- Ziffernblock ---------------- */
function getVal(g, pid, ref) {
  if (g.kind === 'cats') return catVal(g, ref, pid);
  const r = g.rounds.find(x => x.id === ref); return r && typeof r.s[pid] === 'number' ? r.s[pid] : null;
}
function setVal(g, pid, ref, v) {
  if (g.kind === 'cats') { if (v === null) delete g.cells[ref][pid]; else g.cells[ref][pid] = v; return; }
  const r = g.rounds.find(x => x.id === ref); if (v === null) delete r.s[pid]; else r.s[pid] = v;
}
function openPad(pid, ref) {
  const v = getVal(S.game, pid, ref);
  S.pad = { pid, ref, buf: v === null ? '' : String(v), fresh: v !== null };
  document.body.classList.add('pad-open');
  renderGame(); renderPad();
  const el = document.querySelector(`td.cell[data-p="${pid}"][data-r="${ref}"]`);
  const w = $('#ov-grid');
  if (el && w) {
    const er = el.getBoundingClientRect(), wr = w.getBoundingClientRect(), foot = 64;
    if (er.bottom > wr.bottom - foot) w.scrollTop += er.bottom - wr.bottom + foot;
    else if (er.top < wr.top + 50) w.scrollTop -= wr.top + 50 - er.top;
  }
}
function closePad() {
  S.pad = null; document.body.classList.remove('pad-open');
  $('#pad').hidden = true; $('#s-game').style.paddingBottom = ''; renderGame();
}
function padNum() { const b = S.pad.buf; return b === '' || b === '-' ? null : parseInt(b, 10); }
function commitPad() {
  const g = S.game, v = padNum();
  if (v !== getVal(g, S.pad.pid, S.pad.ref)) { snapshot(); setVal(g, S.pad.pid, S.pad.ref, v); save(); }
}
function renderPad() {
  const g = S.game, P = S.pad, p = g.players.find(x => x.id === P.pid);
  const v = padNum(), cur = getVal(g, P.pid, P.ref);
  const after = totals(g)[P.pid] - (cur || 0) + (v || 0);
  let where = '', quick = '', isCat = g.kind === 'cats';
  if (isCat) {
    const c = DICE.find(x => x.id === P.ref);
    where = c.name + (c.hint ? ' · ' + c.hint : '');
    const vals = c.quick || (c.fixed ? [c.fixed] : []);
    quick = `<div class="quick">${vals.filter(x => x !== 0).map(x => `<button data-act="pad-set" data-v="${x}">${x}</button>`).join('')}
      <button class="strike" data-act="pad-set" data-v="0">Streichen · 0</button></div>`;
  } else {
    where = 'Runde ' + (g.rounds.findIndex(r => r.id === P.ref) + 1);
  }
  const qk = isCat ? ['', '', '', ''] : ['+5', '+10', '−5', '−10'];
  const qv = [5, 10, -5, -10];
  const k = (lbl, i) => isCat ? '' : `<button class="key q" data-act="pad-add" data-v="${qv[i]}">${lbl}</button>`;
  const cols = isCat ? 3 : 4;
  const isLast = !isCat && (() => {
    const pi = g.players.findIndex(x => x.id === P.pid), ri = g.rounds.findIndex(r => r.id === P.ref);
    return pi === g.players.length - 1 && g.end.type === 'rounds' && ri >= g.end.value - 1;
  })();
  $('#pad').innerHTML = `
    <div class="grab"></div>
    <div class="sheet-body">
      <div class="pad-head">
        <span class="dot" style="--c:${p.color};width:14px;height:14px"></span>
        <div class="who"><b>${esc(p.name)}</b><small>${esc(where)}</small></div>
        ${isCat ? '' : `<div class="navs"><button class="icon-btn" data-act="pad-move" data-d="-1" aria-label="Vorheriger Spieler">${ICON.prev}</button>
        <button class="icon-btn" data-act="pad-move" data-d="1" aria-label="Nächster Spieler">${ICON.next}</button></div>`}
        <button class="icon-btn" data-act="pad-close" aria-label="Ziffernblock schließen">${ICON.close}</button>
      </div>
      <div class="pad-display">
        <span class="val ${v === null ? 'ph' : ''} ${v !== null && v < 0 ? 'neg' : ''}">${v === null ? '0' : fmt(v)}</span>
        <span class="after">Summe danach<b>${fmt(after)}</b></span>
      </div>
      ${quick}
      <div class="keys" style="grid-template-columns:repeat(${cols},1fr)">
        ${[1, 2, 3].map(d => `<button class="key" data-act="pad-digit" data-v="${d}">${d}</button>`).join('')}${k(qk[0], 0)}
        ${[4, 5, 6].map(d => `<button class="key" data-act="pad-digit" data-v="${d}">${d}</button>`).join('')}${k(qk[1], 1)}
        ${[7, 8, 9].map(d => `<button class="key" data-act="pad-digit" data-v="${d}">${d}</button>`).join('')}${k(qk[2], 2)}
        <button class="key fn" data-act="pad-sign" aria-label="Vorzeichen">±</button>
        <button class="key" data-act="pad-digit" data-v="0">0</button>
        <button class="key fn" data-act="pad-back" aria-label="Löschen">${ICON.back}</button>${k(qk[3], 3)}
      </div>
      <div class="pad-actions">
        <button class="secondary" data-act="pad-clear">Leeren</button>
        <button class="primary" data-act="pad-ok">${isCat || isLast ? 'Eintragen' : 'Weiter →'}</button>
      </div>
    </div>`;
  $('#pad').hidden = false;
  $('#s-game').style.paddingBottom = $('#pad').offsetHeight + 'px';
}
function padMove(dir) {
  const g = S.game, P = S.pad;
  let pi = g.players.findIndex(x => x.id === P.pid), ri = g.rounds.findIndex(r => r.id === P.ref);
  pi += dir;
  if (pi >= g.players.length) { pi = 0; ri++; }
  if (pi < 0) { pi = g.players.length - 1; ri--; }
  if (ri < 0) return false;
  if (ri >= g.rounds.length) {
    if (g.end.type === 'rounds' && g.rounds.length >= g.end.value) return false;
    const e = endState(g); if (e && e.done) return false;
    snapshot(); g.rounds.push({ id: uid(), createdAt: now(), s: {} }); save();
  }
  openPad(g.players[pi].id, g.rounds[ri].id);
  return true;
}

/* ---------------- Sheets: Menü, Ergebnis, Baukasten ---------------- */
function openSheet(html, label) {
  const s = $('#sheet2'); s.innerHTML = '<div class="grab"></div><div class="sheet-body">' + html + '</div>';
  s.setAttribute('aria-label', label); s.hidden = false; $('#scrim').hidden = false;
}
function closeSheet() { $('#sheet2').hidden = true; $('#scrim').hidden = true; }

function openMenu() {
  const g = S.game;
  openSheet(`
    <h3>${esc(g.name)}</h3>
    <div class="field"><label>Gewinner</label>
      <div class="seg"><button data-act="set-win" data-v="high" aria-pressed="${g.win === 'high'}">Höchste Summe</button>
      <button data-act="set-win" data-v="low" aria-pressed="${g.win === 'low'}">Niedrigste Summe</button></div></div>
    <div class="menu-list">
      <button data-act="save-tpl">Als Vorlage speichern <small>für den Start</small></button>
      <button data-act="result">Spiel beenden <small>Ergebnis zeigen</small></button>
      <button class="warn" data-act="discard">Partie verwerfen</button>
    </div>`, 'Spielmenü');
}

function openResult() {
  const g = S.game, rk = ranking(g);
  openSheet(`
    <div class="eyebrow">${esc(g.name)} · ${new Date().toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' })}</div>
    <h3>${anyScore(g) ? esc(rk.filter(x => x.place === 1).map(x => x.p.name).join(' & ')) + ' gewinnt' : 'Noch keine Punkte'}</h3>
    <div class="podium">${rk.map(x => `<div class="prow ${x.place === 1 && anyScore(g) ? 'win' : ''}">
      <span class="place">${x.place}</span><span class="dot" style="--c:${x.p.color}"></span>
      <span class="nm">${esc(x.p.name)}</span><span class="pts">${fmt(x.t)}</span></div>`).join('')}</div>
    <p class="note">Im echten Produkt landet die Partie hier in der Historie, mit Ort und Anlass (z. B. „Südamerika 2026“).</p>
    <div class="pad-actions">
      <button class="secondary" data-act="close-sheet">Weiterspielen</button>
      <button class="primary" data-act="rematch">Revanche</button>
    </div>`, 'Ergebnis');
}

const CFG = { name: '', win: 'high', end: 'none', val: 500 };
function openConfig() {
  const valField = CFG.end === 'none' ? '' : `<div class="field"><label for="cfg-val">${CFG.end === 'target' ? 'Zielpunktzahl' : 'Anzahl Runden'}</label>
    <input id="cfg-val" inputmode="numeric" pattern="[0-9]*" value="${CFG.val}"></div>`;
  openSheet(`
    <h3>Eigene Regeln</h3>
    <div class="field"><label for="cfg-name">Name der Vorlage</label><input id="cfg-name" placeholder="z. B. Rommé am Strand" value="${esc(CFG.name)}" maxlength="28"></div>
    <div class="field"><label>Gewinner</label><div class="seg">
      <button data-act="cfg" data-k="win" data-v="high" aria-pressed="${CFG.win === 'high'}">Höchste Summe</button>
      <button data-act="cfg" data-k="win" data-v="low" aria-pressed="${CFG.win === 'low'}">Niedrigste Summe</button></div></div>
    <div class="field"><label>Spielende</label><div class="seg">
      <button data-act="cfg" data-k="end" data-v="none" aria-pressed="${CFG.end === 'none'}">Offen</button>
      <button data-act="cfg" data-k="end" data-v="target" aria-pressed="${CFG.end === 'target'}">Zielpunkte</button>
      <button data-act="cfg" data-k="end" data-v="rounds" aria-pressed="${CFG.end === 'rounds'}">Runden</button></div></div>
    ${valField}
    <p class="note">Später kommen hier Kategorien, Bonusregeln und Teams dazu.</p>
    <div class="pad-actions"><button class="primary" data-act="cfg-save">Vorlage speichern</button></div>`, 'Eigene Regeln');
}
function readCfgInputs() {
  const n = $('#cfg-name'); if (n) CFG.name = n.value;
  const v = $('#cfg-val'); if (v) CFG.val = parseInt(v.value, 10) || 0;
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 1800);
}

/* ---------------- Aktionen ---------------- */
const A = {
  'pick-tpl'(el, ev) {
    if (ev.target.closest('[data-act="del-tpl"]')) return A['del-tpl'](ev.target.closest('[data-act="del-tpl"]'));
    S.tpl = templates().find(t => t.id === el.dataset.id);
    const last = store.get('lastPlayers', null);
    S.sel = last && last.length ? last.filter(n => S.known.includes(n)) : [];
    renderPlayers();
  },
  'del-tpl'(el) {
    store.set('tpls', store.get('tpls', []).filter(t => t.id !== el.dataset.id)); renderHome(); toast('Vorlage gelöscht');
  },
  'toggle-p'(el) {
    const n = el.dataset.name, i = S.sel.indexOf(n);
    if (i >= 0) S.sel.splice(i, 1); else S.sel.push(n);
    renderPlayers();
  },
  start() {
    if (!S.sel.length) return;
    store.set('lastPlayers', S.sel);
    enterGame(newGame(S.tpl, S.sel.slice()));
  },
  'go-home'() { if (S.pad) closePad(); closeSheet(); renderHome(); },
  resume() { renderGame(); },
  cell(el) {
    const g = S.game;
    if (isBids(g)) { const i = g.players.findIndex(p => p.id === el.dataset.p); return ppGotoField(i, el.dataset.r); }
    if (S.pad) commitPad();
    openPad(el.dataset.p, el.dataset.r);
  },
  'pad-digit'(el) {
    const P = S.pad;
    if (P.fresh) { P.buf = P.buf.startsWith('-') ? '-' : ''; P.fresh = false; }
    if (P.buf.replace('-', '').length >= 6) return;
    P.buf = (P.buf === '0' ? '' : P.buf === '-0' ? '-' : P.buf) + el.dataset.v;
    renderPad();
  },
  'pad-add'(el) {
    const P = S.pad; P.buf = String((padNum() || 0) + parseInt(el.dataset.v, 10)); P.fresh = false; renderPad();
  },
  'pad-set'(el) { S.pad.buf = el.dataset.v; S.pad.fresh = true; renderPad(); },
  'pad-sign'() { const P = S.pad; P.buf = P.buf.startsWith('-') ? P.buf.slice(1) : '-' + P.buf; P.fresh = false; renderPad(); },
  'pad-back'() { const P = S.pad; P.buf = P.fresh ? '' : P.buf.slice(0, -1); P.fresh = false; renderPad(); },
  'pad-clear'() { S.pad.buf = ''; S.pad.fresh = false; renderPad(); },
  'pad-ok'() {
    commitPad();
    if (S.game.kind === 'cats' || !padMove(1)) closePad();
  },
  'pad-close'() { commitPad(); closePad(); },
  'pad-move'(el) { commitPad(); if (!padMove(parseInt(el.dataset.d, 10))) renderPad(); },
  scrim() { if (S.pad) { commitPad(); closePad(); } closeSheet(); },
  'add-round'() {
    snapshot(); S.game.rounds.push({ id: uid(), createdAt: now(), s: {} }); save(); renderGame();
    const w = $('#ov-grid'); if (w) w.scrollTop = w.scrollHeight;
    if (S.pp.idx < 0) openPad(S.game.players[0].id, S.game.rounds[S.game.rounds.length - 1].id);
  },
  undo() {
    if (!S.undo.length) return;
    S.game = JSON.parse(S.undo.pop()); save();
    if (S.pp.idx >= 0) { const ref = S.pp.ref, g = S.game; const ok = ref && (g.kind === 'cats' || g.rounds.some(r => r.id === ref)); if (ok) ppSelect(ref, S.pp.field); else ppActivate(S.pp.idx); }
    if (S.pad) { S.pad = null; document.body.classList.remove('pad-open'); $('#pad').hidden = true; $('#s-game').style.paddingBottom = ''; }
    renderGame(); toast('Rückgängig gemacht');
  },
  'pp-open'(el) { ppGoto(+el.dataset.i); },
  'pp-goto'(el) { ppGoto(+el.dataset.i); },
  'pp-target'(el) {
    const i = +el.dataset.i; if (i !== S.pp.idx) ppActivate(i);
    ppSelect(el.dataset.r); ppUpdate();
  },
  'pp-next'() { if (isBids(S.game)) return wizNext(); ppGoto((S.pp.idx + 1) % S.game.players.length); },
  'pp-field'(el) { ppSelect(S.pp.ref, el.dataset.f); ppUpdate(); },
  'wz-go'() { const n = wizNextOpen(S.game); ppGotoField(n.i, n.ref, n.f); },
  'pp-digit'(el) {
    const P = S.pp; if (!P.ref) return;
    if (P.fresh) { P.buf = P.buf.startsWith('-') ? '-' : ''; P.fresh = false; }
    if (P.buf.replace('-', '').length >= 6) return;
    P.buf = (P.buf === '0' ? '' : P.buf === '-0' ? '-' : P.buf) + el.dataset.v;
    ppWrite(); ppUpdate();
  },
  'pp-add'(el) { const P = S.pp; if (!P.ref) return; P.buf = String((ppNum() || 0) + parseInt(el.dataset.v, 10)); P.fresh = false; ppWrite(); ppUpdate(); },
  'pp-set'(el) { const P = S.pp; if (!P.ref) return; P.buf = el.dataset.v; P.fresh = true; ppWrite(); if (el.dataset.go && isBids(S.game)) return wizNext(); ppUpdate(); },
  'pp-sign'() { const P = S.pp; if (!P.ref) return; P.buf = P.buf.startsWith('-') ? P.buf.slice(1) : '-' + P.buf; P.fresh = false; ppWrite(); ppUpdate(); },
  'pp-back'() { const P = S.pp; if (!P.ref) return; P.buf = P.fresh ? '' : P.buf.slice(0, -1); P.fresh = false; ppWrite(); ppUpdate(); },
  'pp-clear'() { const P = S.pp; if (!P.ref) return; P.buf = ''; P.fresh = false; ppWrite(); ppUpdate(); },
  'open-menu'() { openMenu(); },
  'set-win'(el) { snapshot(); S.game.win = el.dataset.v; save(); renderGame(); openMenu(); },
  'save-tpl'() {
    const g = S.game, list = store.get('tpls', []);
    list.push({ id: uid(), custom: true, glyph: '✎', name: g.name, kind: g.kind, win: g.win, end: { ...g.end }, view: g.view, createdAt: now() });
    store.set('tpls', list); closeSheet(); toast('Vorlage gespeichert');
  },
  result() { if (S.pad) { commitPad(); closePad(); } openResult(); },
  rematch() {
    const g = S.game, t = templates().find(x => x.id === g.templateId) || { ...g, id: g.templateId };
    closeSheet(); enterGame(newGame({ ...t, win: g.win }, g.players.map(p => p.name))); toast('Neue Partie, gleiche Runde');
  },
  'close-sheet'() { closeSheet(); },
  discard() { S.game = null; S.undo = []; store.del('game'); closeSheet(); renderHome(); toast('Partie verworfen'); },
  'open-config'() { CFG.name = ''; CFG.win = 'high'; CFG.end = 'none'; CFG.val = 500; openConfig(); },
  cfg(el) {
    readCfgInputs();
    const k = el.dataset.k, v = el.dataset.v;
    if (k === 'end' && v !== CFG.end) CFG.val = v === 'rounds' ? 10 : 500;
    CFG[k] = v; openConfig();
  },
  'cfg-save'() {
    readCfgInputs();
    if (!CFG.name.trim()) { toast('Bitte einen Namen eingeben'); return; }
    if (CFG.end !== 'none' && CFG.val < 1) { toast('Zahl muss größer als 0 sein'); return; }
    const t = { id: uid(), custom: true, glyph: '✎', name: CFG.name.trim(), kind: 'rounds', win: CFG.win,
      end: CFG.end === 'none' ? { type: 'none' } : { type: CFG.end, value: CFG.val }, createdAt: now() };
    store.set('tpls', store.get('tpls', []).concat(t)); closeSheet(); renderHome(); toast('Vorlage gespeichert');
  }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const f = A[el.dataset.act]; if (f) f(el, ev);
});
$('#add-form').addEventListener('submit', ev => {
  ev.preventDefault();
  const inp = $('#add-name'), n = inp.value.trim();
  if (!n) return;
  if (!S.known.includes(n)) { S.known.push(n); store.set('known', S.known); }
  if (!S.sel.includes(n)) S.sel.push(n);
  inp.value = ''; inp.blur(); renderPlayers();
});

function enterGame(g) {
  S.game = g; S.undo = [];
  const n = isBids(g) ? wizNextOpen(g) : null;
  ppActivate(n ? n.i : g.view === 'players' ? 0 : -1); if (n) ppSelect(n.ref, n.f);
  save(); renderGame();
}
if (S.game) { ppActivate(-1); renderGame(); } else renderHome();
})();
</script>
